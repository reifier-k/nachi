name: Version Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: version-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-pr:
    name: Create or update release PR
    if: ${{ github.repository == 'reifier-k/nachi' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update release PR
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm version-packages
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
          commitMode: github-api

      - name: Run checks for release PR
        if: ${{ steps.changesets.outputs.pullRequestNumber != '' }}
        env:
          BASE_REF: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: changeset-release/${{ github.ref_name }}
        run: |
          gh workflow run ci.yml --ref "$RELEASE_BRANCH"
          gh workflow run security.yml --ref "$RELEASE_BRANCH" \
            --field base_ref="$BASE_REF" \
            --field head_ref="$RELEASE_BRANCH"
